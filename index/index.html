<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Heure et Date</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f5f5;
        }
        .card{
            margin-top:100px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card text-center shadow">
                <div class="card-body">

                    <h3 class="mb-3">Afficher l'heure et la date Afficher meme</h3>

                    <p id="resultat" class="fs-4 text-primary"></p>

                    <button class="btn btn-success" onclick="afficherHeure()">
                        Cliquer ici
                    </button>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
function afficherHeure(){

    let maintenant = new Date();

    let heure = maintenant.toLocaleTimeString();
    let date = maintenant.toLocaleDateString();

    document.getElementById("resultat").innerHTML =
        "Date : " + date + "<br>Heure : " + heure;
}
</script>

</body>
</html>
